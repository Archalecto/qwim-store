{% extends 'store/base.html' %}
{% block content %}

<div style="max-width: 400px; margin: 4rem auto;">
    <div style="text-align:center; margin-bottom:2rem;">
        <div style="font-size:2.5rem; margin-bottom:0.75rem;">👤</div>
        <h1 style="font-family:'Rajdhani',sans-serif; font-size:1.8rem; font-weight:700;">Создать аккаунт</h1>
        <p style="color: var(--text-muted); font-size:0.875rem; margin-top:4px;">Уже есть аккаунт? <a href="{% url 'login' %}" style="color: var(--orange);">Войдите</a></p>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary btn-lg w-100 mt-3">Зарегистрироваться →</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
